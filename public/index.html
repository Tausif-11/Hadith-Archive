<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HadithArchive</title>
  
  <link rel="stylesheet" href="/style.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- App Layout -->
  <nav class="navbar">
    <div class="logo-group" onclick="navigateToBooks()">
      <i data-lucide="book-open" class="logo-icon"></i>
      <h2>HadithArchive</h2>
    </div>
    <div class="nav-actions">
      <button class="btn btn-icon" onclick="toggleFavoritesView()" title="Bookmarks">
        <i data-lucide="bookmark"></i>
      </button>
      <button class="btn btn-icon" onclick="toggleTheme()" title="Toggle Theme">
        <i id="themeIcon" data-lucide="moon"></i>
      </button>
    </div>
  </nav>

  <div class="breadcrumb-container">
    <div id="breadcrumb"></div>
  </div>

  <main class="container">
    <section id="viewBooks" class="view-section">
      <div class="search-container">
        <i data-lucide="search" class="search-icon"></i>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Search Hadith text, narrator, or topic across all books..." 
          oninput="filterBooks()" 
        />
      </div>

      <h2 style="margin-bottom: 1rem;">Hadith Collections</h2>
      <div id="booksGrid"></div>
    </section>

    <section id="viewChapters" class="view-section hidden">
      <div class="chapter-nav-bar">
        <div>
          <h2 id="chapterBookTitle">Collection</h2>
          <div id="chapterBookArabic" style="font-family: var(--font-arabic); color: var(--brand-color);"></div>
        </div>
      </div>
      <div id="chaptersList" class="chapters-list"></div>
    </section>

    <section id="viewHadiths" class="view-section hidden">
      <div class="chapter-nav-bar">
        <div>
          <span id="chapterBadge" class="chapter-badge">Chapter</span>
          <h2 id="chapterTitleEnglish" style="display:inline; margin-left: 0.5rem;">Chapter Title</h2>
          <div id="chapterTitleArabic" style="font-family: var(--font-arabic); color: var(--brand-color); font-size: 1.2rem;"></div>
        </div>
        <div class="card-actions">
          <button class="btn" onclick="navigateChapter(-1)"><i data-lucide="chevron-left"></i> Prev</button>
          <button class="btn" onclick="navigateChapter(1)">Next <i data-lucide="chevron-right"></i></button>
        </div>
      </div>
      <div id="hadithContainer"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
