<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HadithArchive</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Indo-Pak / Naskh Compatible Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-container">
      <div class="brand" onclick="navigateToBooks()">
        <i data-lucide="book-open"></i>
        <span>HadithArchive</span>
      </div>
      
      <div class="nav-actions">
        <button class="icon-btn" onclick="toggleFavoritesView()" title="Bookmarks" id="favBtn">
          <i data-lucide="bookmark"></i>
        </button>
        <button class="icon-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
          <i data-lucide="sun" id="themeIcon"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Breadcrumb Navigation Bar -->
  <div class="breadcrumb-bar">
    <div class="container" id="breadcrumb">
      <span class="crumb active" onclick="navigateToBooks()">Collections</span>
    </div>
  </div>

  <!-- Main Container -->
  <main class="container main-content">
    
    <!-- View 1: Books Grid -->
    <section id="viewBooks" class="view-section">
      <h2 class="section-title">Hadith Collections</h2>
      <div class="books-grid" id="booksGrid"></div>
    </section>

    <!-- View 2: Chapters List -->
    <section id="viewChapters" class="view-section hidden">
      <div class="book-header">
        <h2 id="chapterBookTitle">Collection Name</h2>
        <p id="chapterBookArabic" class="arabic-sub"></p>
      </div>
      <div class="chapters-list" id="chaptersList"></div>
    </section>

    <!-- View 3: Hadiths List -->
    <section id="viewHadiths" class="view-section hidden">
      <!-- Chapter Title Header at top of chapter section -->
      <div class="chapter-banner">
        <div class="chapter-banner-info">
          <span class="chapter-badge" id="chapterBadge">Chapter 1</span>
          <h2 id="chapterTitleEnglish">Chapter Name</h2>
          <h3 id="chapterTitleArabic" class="arabic-text-header"></h3>
        </div>

      
        <div class="chapter-pagination">
          <button class="btn" onclick="navigateChapter(-1)"><i data-lucide="chevron-left"></i> Previous</button>
          <button class="btn" onclick="navigateChapter(1)">Next <i data-lucide="chevron-right"></i></button>
        </div>
      </div>

      <div class="hadith-feed" id="hadithContainer"></div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
